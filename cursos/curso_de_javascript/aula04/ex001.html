<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex001 - JavaScript</title>
    <style>
        body {
            background-color: lightblue;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            color: white;
            main {
                background-color: rgb(59, 201, 226);
                border-radius: 15px;
                margin: 10px auto;
                max-width: 600px;
                padding: 5px;
                h1, p {
                    margin: 5px 0px;
                }
                box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.4);

        }

</head>
<body>
    <main>
        <h1>Hello, world!</h1>
        <p>Arquivo criado para teste no curso de JavaScript!</p>

        window.alert("Olá!")
        window.confirm("Confirme essa mensagem...")
        window.prompt("Digite algo:")
    </script>

</html>
