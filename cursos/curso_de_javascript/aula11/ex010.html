<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex010 - JavaScript</title>
    <style>
        body {
            background-color: lightblue;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            color: white;
            main {
                background-color: rgb(59, 201, 250);
                border-radius: 15px;
                margin: 10px auto;
                max-width: 800px;
                padding: 5px;
                h1, p {
                    margin: 5px 0px;
                }
                input#vel {
                    width: 50px;
                    text-align: center;
                    border: 0.5px solid black;
                    border-radius:9px;
                }

                input#botao {
                    text-align: center;
                    border: 0.5px solid black;
                    border-radius:9px;
                }

                box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.4);
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>Sistema de Multas</h1>
        <p>Velocidade do carro: <input type="number" name="velocidade" id="vel">Km/h <input type="button" value="Verificar" id="botao"></p>
        <div id="res"></div>
    </main>
    <script>
        var vel = window.document.querySelector('#vel')
        var botao = window.document.querySelector('#botao')
        var res = window.document.querySelector('#res')
        
        botao.addEventListener('click', clicar)
        
        function clicar() {
            res.innerHTML = null
            res.innerHTML += (`<p>Sua velocidade atual é <strong>${vel.value}Km/h</strong>.</p>`)
            if (Number(vel.value) > 60) {
                res.innerHTML += (`<p>Você foi <strong>MULTADO</strong> por excesso de velocidade!</p>`)
            } 
            res.innerHTML += (` <p><strong>SEMPRE</strong> dirija com o cinto de segurança!</p>`)
        }
    </script>
</body>
</html>
