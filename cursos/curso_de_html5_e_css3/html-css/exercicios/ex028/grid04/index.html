<!DOCTYPE html>
<html lang="pr-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid-Layout</title>
    <style>
        .container {
            display: grid;
            grid-template: repeat(3, 100px) / repeat(4, 1fr);
            grid-auto-rows: 100px;
            grid-auto-columns: 1fr;
            gap: 5px;
            padding: 5px;
            border: 1px solid black;
            color: white;
            text-shadow: 1px 1px 2px black;
        }

        .container > div {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .caixa1 {
            background-color: red;
            grid-row-start: 1;
            grid-column-start: 1;
            grid-row-end:  2;
            grid-column-end:  5;
        }

        .caixa2 {
            background-color: green;
            grid-row-start: 2;
            grid-column-start: 1;
            grid-row-end:  4;
            grid-column-end:  3;
        }

        .caixa3 {
            background-color: blue;
            grid-row-start: 3;
            grid-column-start: 3;
            grid-row-end:  4;
            grid-column-end:  4;
        }

        .caixa4 {
            background-color: yellow;
            grid-row-start: 2;
            grid-column-start: 4;
            grid-row-end:  4;
            grid-column-end:  5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="caixa1">Caixa 1</div>
        <div class="caixa2">Caixa 2</div>
        <div class="caixa3">Caixa 3</div>
        <div class="caixa4">Caixa 4</div>
    </div>
</body>
</html>
