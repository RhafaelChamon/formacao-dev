<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Idade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Verificador de Idade</h1>
    </header>
    <main>
        <p>Ano de Nascimento: <input type="number" name="nascimento" id="ano_nasc"></p>
        <p>Sexo:
            <input type="radio" name="sex" id="masc" checked>
            <label for="masc">Masculino</label>
            <input type="radio" name="sex" id="femi">
            <label for="femi">Feminino</label>
        </p>
        <div>
            <input type="button" value="Verificar" id="botao">
        </div>
        <div id="res">
            <p>Preencha todos os dados para ver o resultado!</p>
        </div>
    </main>
    <footer>
        <p>&copy; Curso em Vídeo</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
