<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisador de Números</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Analisador de Números</h1>
    </header>
    <main>
        <div class="dados">
            <p>Número (entre de 1 e 100): 
                <input type="number" name="numero" id="num"> 
                <button id="botao_add">Adicionar</button>
            </p>
        </div>
        <div>
            <select name="numeros" id="select_num" size="5">
            </select>
            <br>
            <div id="botao_end">
                <button>Finalizar</button>
            </div>
        </div>
        <div id="resu"></div>
    </main>
    <footer>
        <p>&copy; Curso em Vídeo</p>
    </footer>
    <script src="script.js"></script>
</body>

</html>
