<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <a href="#" onclick="cliclou()">Clique aqui.</a>
    <div id="container"></div>

    <script>
        function cliclou() {
            let s = document.getElementById('container')

            s.innerHTML += '<p>Você clicou no botão!</p>'
        }
    </script>
</body>
</html>
