<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
    <style>
        div.conteiner {
            background-color: lightsalmon;
            display: flex;
            height: 50vh;
            flex-flow: row w;
        }

        div.flex-item {
            background-color: lightskyblue;
            border: 1px solid black;
            padding: 10px;
            margin: 5px;
            text-align: center;

            flex: auto;
        }

        div#i1 {
            align-self: auto;
        }

        div#i2 {
            align-self: start;
        }

        div#i3 {
            align-self: center;
        }

        div#i4 {
            align-self: end;
        }

        div#i5 {
            align-self: stretch;
        }

        div#i6 {
            align-self: flex-start;
        }

        div#i7 {
            align-self: flex-end;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="flex-item" id="i1">A</div>
        <div class="flex-item" id="i2">B</div>
        <div class="flex-item" id="i3">C</div>
        <div class="flex-item" id="i4">D</div>
        <div class="flex-item" id="i5">E</div>
        <div class="flex-item" id="i6">F</div>
        <div class="flex-item" id="i7">G</div>
    </div>
</body>
</html>
