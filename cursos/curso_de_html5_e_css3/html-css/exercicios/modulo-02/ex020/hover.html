<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Hover</title>
    <style>
        
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        
        p {
            text-align: center;
        }

        div > .msgsecreta {
            display: none;
            width: 200px;
            background-color: red;
            border: 1px solid black;
            color: white;
            margin: 0 auto;
        }

        div:hover > .msgsecreta {
            display: block;
        }
    </style>
</head>
<body>
    <h1>Exemplo de Hover</h1>
    <div>
        <p> &gt; Passe o mouse aqui &lt; </p>
        <p class="msgsecreta">SURPRESAA!!!</p>
    </div>
</body>
</html>
