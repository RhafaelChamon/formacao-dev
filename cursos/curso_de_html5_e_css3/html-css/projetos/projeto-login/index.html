<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="estilos/media-query.css">
</head>
<body>
    <main>
        <div id="photo"></div>
        <div id="form">
            <h1>Login</h1>
            <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu ambiente.</p>
            <form action="login.php" method="post" autocomplete="on">
                <div class="area">
                    <label for="email">
                        <span class="material-icons non-select">person</span>
                    </label>
                    <input type="email" name="email" id="email" autocomplete="email" placeholder="E-mail" pattern="^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" required>
                </div>
                <div class="area">
                    <label for="password"><span class="material-icons non-select">key</span></label>
                    <input type="password" name="password" id="password" autocomplete="current-password" placeholder="Password" minlength="8" required>
                </div>

                <button type="submit" class="submit-button non-select">Entrar<span class="material-icons">login</span></button>
                <a href="esqueci.html" class="forgot-button non-select">Esqueci a senha <span class="material-icons">mail</span></a>
                <i class="fa-brands fa-apple"></i>
            </form>
        </div>
    </main>
</body>
</html>
