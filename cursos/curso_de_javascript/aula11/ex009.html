<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex009 - JavaScript</title>
    <style>
        body {
            background-color: lightblue;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            color: white;
            main {
                background-color: rgb(59, 201, 250);
                border-radius: 15px;
                margin: 10px auto;
                max-width: 800px;
                padding: 5px;
                h1, p {
                    margin: 5px 0px;
                }
                input#pais_origem {
                    width: 30%;
                    text-align: center;
                    border: 0.5px solid black;
                    border-radius:9px;
                }

                input#botao {
                    text-align: center;
                    border: 0.5px solid black;
                    border-radius:9px;
                }

                box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.4);
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>Serviço de Naturalização</h1>
        <p>Qual país você nasceu? <input type="text" name="pais" id="pais_origem"> <input type="button" value="Verificar" id="botao"></p>
        <div id="res"></div>
    </main>
    <script>
        var pais = window.document.querySelector('#pais_origem')
        var botao = window.document.querySelector('#botao')
        var res = window.document.querySelector('#res')
        
        botao.addEventListener('click', clicar)
        
        function clicar() {
            res.innerHTML = null
            res.innerHTML += (`<p>Você nasceu no(a) ${pais.value}.</p>`)
            if (pais.value.toUpperCase() == 'BRASIL') {
                res.innerHTML += (` <p>Por isso você é considerado BRASILEIRO(A)!</p>`)
            } else {
                res.innerHTML += (` <p>Por isso você é considerado ESTRANGEIRO(A)!</p>`)
            }
        }
    </script>
</body>
</html>
