<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        
        table {
            width: 500px;
            height: 500px;
            border-collapse: collapse;
        }
        
        .num {
            text-align: right;
        }

        td {
            border: 1px solid;
        }
        
        .cinza {
            background-color: gray;
        }

        .amarelo {
            background-color: yellow;
        }
    </style>
</head>
<body>
    <!-- 
    Hierarquia da tabela:
    > table
        > table row (tr)
            > table header (th)
            > table data (td)
    
    -->
    
    <h1>Tabela em HTML</h1>
    <table>
        <tr class="amarelo">
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr class="cinza">
            <td>A2</td>
            <td>B2</td>
            <td class="num">C2</td>
        </tr>
        <tr>
            <td class="num">A3</td>
            <td>B3
            <td>C3</td>
        </tr>
        <tr>
            <td>A4</td>
            <td class="amarelo">B4</td>
            <td>C4</td>
    </table>
</body>
</html>
