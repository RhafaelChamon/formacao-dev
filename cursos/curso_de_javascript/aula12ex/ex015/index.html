<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Idade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Verificador de Idade</h1>
    </header>
    <main>
        <div id="formu">
            <div id="ano_nasc">
                <p>Ano de Nascimento: <input type="number" name="nascimento"></p>
            </div>
            <div id="sex">
                <p>Sexo:
                    <input type="radio" name="sex" id="masc" checked>
                    <label for="masc">Masculino</label>
                    <input type="radio" name="sex" id="femi">
                    <label for="femi">Feminino</label>
                </p>
            </div>
            <div id="botao">
                <input type="button" value="Verificar">
            </div>
        </div>
        <div id="res">
            <p>Preencha todos os dados para ver o resultado!</p>
            <img src="fotos/foto-idoso-f.png" alt="Foto da pessoa">
        </div>
    </main>
    <footer>
        <p>&copy; Curso em Vídeo</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
