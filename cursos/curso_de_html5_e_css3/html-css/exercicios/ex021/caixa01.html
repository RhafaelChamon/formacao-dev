<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        
        h1 {
            background-color: lightgray;
            
            height: 300px;
            width: 300px;
            padding: 10px 30px;
            border: 10px solid seagreen;
            outline: 5px dashed red;
            margin: auto;
        }

        a {
            border: 4px solid red;
            padding: 3px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>
        Parágrafos também são exemplos de box-level, mas os <a href="#">links são exemplos de caixas inline-level</a>. Arquivo de aprendizado.
    </p>
</body>
</html>
