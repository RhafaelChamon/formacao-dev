<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex002 - JavaScript</title>
    <style>
        body {
            background-color: lightblue;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            color: white;
            div {
                background-color: rgb(59, 201, 226);
                border-radius: 15px;
                margin: 10px auto;
                max-width: 600px;
                padding: 5px;
                h1, p {
                    margin: 5px 0px;
                }
                box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.4);
            }
        }
    </style>
</head>
<body>
    <div>
        <h1>Hello, world!</h1>
        <p>Arquivo criado para teste no curso de JavaScript!</p>
    </div>
    <script>
        var nome = window.prompt('Digite seu nome:') // Pergunta e salva o nome na variável 'nome'
        window.alert('É um prazer te conhecer ' + nome + '!') // Monstra um alerta com o nome
    </script>
</body>
</html>
