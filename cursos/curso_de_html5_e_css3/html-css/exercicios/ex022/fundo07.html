<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centralizando div's</title>

    <style>
        .container#position {
            position: relative;

            .content {
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%, -50%);
            }

            #no_transf {
                transform: translate(0, 0);
                background-color: rgba(149, 255, 0, 0.47);
            }
        }

        .container#display_flex {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container#display_grid {
            display: grid;
            place-items: center;
        }




        
        body {
            display: flex;
            justify-content: center;
        }
        
        main {
            width: 100%;
            max-width: 800px;
            font-family: Arial, Helvetica, sans-serif;
        }

        main > p {
            text-transform: uppercase;
            font-weight: bold;
        }

        .container#position p {
            display: inline-block;
            margin: 10px;
            padding: 5px;
            background-color: rgba(255, 255, 255, 0.504);
            border-radius: 5px;
        }

        .container {
            width: 100%;
            height: 500px;
            background: cyan url('imagens/target001.png') center / 100% 100%;
        }

        .content {
            width: 40%;
            height: 40%;
            background: rgba(204, 0, 255, 0.611) url('imagens/target001.png') center / 100% 100%;
        }
    </style>
</head>

<body>
    <main>
        <h1>Centralizando div's</h1>
        
        <p>position</p>
        <div class="container" id="position">
            <p>relative</p>
            <div class="content">
                <p>absolute + transform</p>
            </div>
            <div class="content" id="no_transf">
                <p>absolute</p>
            </div>
        </div>
        <p>display: flex</p>
        <div class="container" id="display_flex">
            <div class="content">
            </div>
        </div>
        <p>display: grid</p>
        <div class="container" id="display_grid">
            <div class="content">
            </div>
        </div>
    </main>
</body>

</html>
